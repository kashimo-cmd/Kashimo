name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      HW_MODE: mock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pc.txt
      - run: pip install -r requirements-pc.txt
      - run: pip install --dry-run -r requirements-pi.txt
      - run: git ls-files '*.sh' | xargs -n1 bash -n
      - run: python -m pytest -q
